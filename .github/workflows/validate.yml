name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.14.2", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y openssl jq
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file certmgmt/runtime-requirements.txt && git diff --exit-code -- certmgmt/runtime-requirements.txt
      - run: uv run --no-sync ruff check certmgmt tests
      - run: uv run --no-sync ruff format --check certmgmt tests
      - run: uv run --no-sync pytest -q
      - run: for script in ./*.sh drivers/*.sh; do sh -n "$script"; done
      - run: uv build
      - run: uv pip check
