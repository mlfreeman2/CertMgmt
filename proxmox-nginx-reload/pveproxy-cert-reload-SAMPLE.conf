# Install as /etc/default/pveproxy-cert-reload, root-owned, mode 0644.
# EnvironmentFile syntax: assignments, not shell commands or variable expansion.

# Required: the hostname you type into the browser, used as TLS SNI on port 443.
TLS_SERVER_NAME=CHANGE_ME

# Defaults. Change TLS_CONNECT if nginx listens only on the host's LAN address.
#TLS_CONNECT=127.0.0.1:443
#CERT_FILE=/etc/pve/local/pveproxy-ssl.pem
