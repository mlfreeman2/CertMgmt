# caddy-cert-receive.conf -- OPTIONAL overrides for /usr/local/bin/caddy-cert-receive
# shellcheck shell=bash
#
# Install as /etc/caddy-cert-receive.conf, root-owned, mode 644.
#
# You probably do not need this file at all. Every value below is already the default, and the
# defaults are correct for Caddy installed from its official Debian package. The receiver runs fine
# with this file absent -- it is sourced only if it exists.
#
# What you DO need is one directory per certificate under $CERT_BASE. That is the enrollment step
# AND the allowlist: a certificate whose SAN matches no directory is refused, and the receiver never
# creates one itself. There are no per-certificate config files.
#
#   install -d -m 2750 -o cert-receiver -g caddy /etc/caddy/certs/apps.example.com
#   install -d -m 2750 -o cert-receiver -g caddy /etc/caddy/certs/internal.example.com
#
# This file is SOURCED as shell by the receiver. Keep it to assignments; anything else runs.

# --- where certificates land ---------------------------------------------------------------------
# A delivery lands in $CERT_BASE/<slot>/, where <slot> is the certificate's own SAN with any leading
# "*." removed. Each pair is staged in a .generation directory, then the current symlink switches.
# The Caddyfile must use /etc/caddy/certs/apps.example.com/current/fullchain.pem and
# /etc/caddy/certs/apps.example.com/current/privkey.pem. The previous symlink retains the prior pair.
# $CERT_BASE must be setgid and group-readable by the server (install -d -m 2750 -o cert-receiver
# -g caddy). Give cert-receiver supplementary membership in caddy; generations inherit that group.
# CERT_FILE and KEY_FILE must be distinct simple filenames, not paths.
#CERT_BASE="/etc/caddy/certs"
#CERT_FILE="fullchain.pem"
#KEY_FILE="privkey.pem"

# --- how a delivery is applied -------------------------------------------------------------------
# RELOAD_CMD empty means: caddy reload --config "$CADDYFILE" --adapter caddyfile --force
# --force matters. A reload diffs the new config against the running one and no-ops when they are
# identical, and renewing a certificate does not change the Caddyfile -- without it the reload
# succeeds, reports nothing, and leaves the old certificate loaded.
# Set RELOAD_CMD to serve something other than a native Caddy. It runs with Bash pipefail as
# cert-receiver, with no tty and stdin closed, so it must need neither sudo nor a password. It must
# finish applying the change before returning. Do not print secrets; command output is logged on failure.
#CADDYFILE="/etc/caddy/Caddyfile"
#RELOAD_CMD=""
#RELOAD_CMD="docker compose -f /srv/caddy/docker-compose.yml up -d --force-recreate caddy"

# --- refusal thresholds --------------------------------------------------------------------------
# Refuse a certificate expiring sooner than this. Adjust for your issuer's certificate lifetime.
#MIN_REMAINING_SECS=86400
# A key plus a chain is ~6 KB. This only exists so a stuck sender cannot stream into the disk.
#MAX_INPUT_BYTES=262144
#LOG_TAG="caddy-cert-receive"

# Nothing here configures a check of what is being SERVED, by design. The sender reads the served
# certificate over TLS after every delivery; a second check on this end would need a hostname kept
# valid forever, and would fail deliveries for its own reasons the day that name was retired.
